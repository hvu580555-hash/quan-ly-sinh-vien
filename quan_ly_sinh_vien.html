<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý Sinh Viên Chuyên Nghiệp</title>
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #34495e;
            --accent: #3498db;
            --light: #ecf0f1;
            --white: #ffffff;
            --success: #27ae60;
            --danger: #e74c3c;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--light); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: var(--white); padding: 25px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); border-bottom: 2px solid var(--accent); padding-bottom: 10px; margin-top: 0; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        input, button { padding: 10px 15px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input { flex: 1; min-width: 200px; }
        button { background-color: var(--accent); color: white; border: none; cursor: pointer; transition: 0.3s; font-weight: 600; }
        button:hover { opacity: 0.85; }
        .btn-add { background-color: var(--success); }
        .btn-edit { background-color: #f39c12; padding: 6px 12px; }
        .btn-delete { background-color: var(--danger); padding: 6px 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        /* Modal ẩn hiện khi thêm sinh viên */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); }
        .modal-content { background-color: var(--white); margin: 10% auto; padding: 25px; border-radius: 8px; width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-content h3 { margin-top: 0; color: var(--primary); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: var(--secondary); }
        .form-group input { width: 100%; box-sizing: border-box; }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Quản Lý Danh Sách Sinh Viên</h2>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Tìm kiếm theo tên sinh viên..." onkeyup="searchStudent()">
            <button onclick="searchStudent()">Tìm kiếm</button>
            <button class="btn-add" onclick="openModal()">+ Thêm Sinh Viên</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Mã SV</th>
                    <th>Họ Tên</th>
                    <th>Ngày Sinh</th>
                    <th>Điểm TB</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr>
                    <td>SV001</td>
                    <td>Nguyễn Văn A</td>
                    <td>20/05/2005</td>
                    <td>8.5</td>
                    <td>
                        <button class="btn-edit" onclick="editRow(this)">Sửa</button> 
                        <button class="btn-delete" onclick="deleteRow(this)">Xóa</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Modal Form Thêm Sinh Viên -->
    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h3>Thêm Sinh Viên Mới</h3>
            <div class="form-group">
                <label>Mã SV:</label>
                <input type="text" id="maSV" placeholder="Ví dụ: SV002">
            </div>
            <div class="form-group">
                <label>Họ Tên:</label>
                <input type="text" id="tenSV" placeholder="Ví dụ: Trần Thị B">
            </div>
            <div class="form-group">
                <label>Ngày Sinh:</label>
                <input type="text" id="ngaySinh" placeholder="Ví dụ: 12/10/2005">
            </div>
            <div class="form-group">
                <label>Điểm TB:</label>
                <input type="number" step="0.1" id="diemTB" placeholder="Ví dụ: 8.0">
            </div>
            <div class="modal-buttons">
                <button style="background-color: #95a5a6;" onclick="closeModal()">Hủy</button>
                <button class="btn-add" onclick="saveStudent()">Lưu</button>
            </div>
        </div>
    </div>

    <script>
        // Mở Modal
        function openModal() {
            document.getElementById('studentModal').style.display = 'block';
            document.getElementById('maSV').value = '';
            document.getElementById('tenSV').value = '';
            document.getElementById('ngaySinh').value = '';
            document.getElementById('diemTB').value = '';
        }

        // Đóng Modal
        function closeModal() {
            document.getElementById('studentModal').style.display = 'none';
        }

        // Lưu sinh viên mới vào bảng
        function saveStudent() {
            let ma = document.getElementById('maSV').value.trim();
            let ten = document.getElementById('tenSV').value.trim();
            let ns = document.getElementById('ngaySinh').value.trim();
            let diem = document.getElementById('diemTB').value.trim();

            if (!ma || !ten || !ns || !diem) {
                alert("Vui lòng điền đầy đủ thông tin!");
                return;
            }

            let table = document.getElementById('studentTable');
            let newRow = table.insertRow();

            newRow.innerHTML = `
                <td>${ma}</td>
                <td>${ten}</td>
                <td>${ns}</td>
                <td>${diem}</td>
                <td>
                    <button class="btn-edit" onclick="editRow(this)">Sửa</button> 
                    <button class="btn-delete" onclick="deleteRow(this)">Xóa</button>
                </td>
            `;
            closeModal();
        }

        // Xóa hàng sinh viên
        function deleteRow(btn) {
            if (confirm("Bạn có chắc chắn muốn xóa sinh viên này không?")) {
                let row = btn.parentNode.parentNode;
                row.parentNode.removeChild(row);
            }
        }

        // Sửa thông tin sinh viên cơ bản
        function editRow(btn) {
            let row = btn.parentNode.parentNode;
            let cells = row.getElementsByTagName('td');
            
            let newTen = prompt("Nhập tên mới:", cells[1].innerText);
            let newDiem = prompt("Nhập điểm TB mới:", cells[3].innerText);

            if (newTen !== null && newTen.trim() !== "") cells[1].innerText = newTen;
            if (newDiem !== null && newDiem.trim() !== "") cells[3].innerText = newDiem;
        }

        // Tìm kiếm sinh viên theo tên
        function searchStudent() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let table = document.getElementById('studentTable');
            let rows = table.getElementsByTagName('tr');

            for (let i = 0; i < rows.length; i++) {
                let tdName = rows[i].getElementsByTagName('td')[1];
                if (tdName) {
                    let textValue = tdName.textContent || tdName.innerText;
                    if (textValue.toLowerCase().indexOf(input) > -1) {
                        rows[i].style.display = "";
                    } else {
                        rows[i].style.display = "none";
                    }
                }
            }
        }
    </script>
</body>
</html>
